name: Production CD Deploy

on:
  push:
    branches:
      - master # Если главная ветка называется main — укажи main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /var/www/alfa-credit

            echo ">>> 1. Обновляем код из Git"
            git fetch origin master
            git reset --hard origin/master

            echo ">>> 2. Применяем скрипты npm (если требуется сборка)"
            docker compose down --remove-orphans || true

            echo ">>> 3. Пересобираем и поднимаем контейнеры"
            docker compose up -d --build

            echo ">>> 4. Удаляем старые неиспользуемые Docker-образы"
            docker image prune -f

            echo ">>> Деплой успешно завершен!"