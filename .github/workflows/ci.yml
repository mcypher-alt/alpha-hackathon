name: Submission checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Build and start the complete submission
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: API end-to-end and access-control checks
        run: node scripts/smoke.mjs
      - name: Backend and model unit tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Product selection tests
        working-directory: client
        run: |
          npm ci
          npm test
      - name: Container status and diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
