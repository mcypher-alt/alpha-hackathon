version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alfa_postgres
    environment:
      POSTGRES_USER: alfa_user
      POSTGRES_PASSWORD: alfa_password
      POSTGRES_DB: alfa_credit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alfa_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://alfa_user:alfa_password@postgres:5432/alfa_credit_db?schema=public"
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alfa_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: